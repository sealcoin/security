name: Non-sensitive report
about: Report a non-exploitable issue with the Security Research Program documentation.
title: "[Non-sensitive]: "
labels: ["type/non-sensitive", "status/new"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose exploitable vulnerabilities in public issues. Use **Report a vulnerability** instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README
        - Security policy
        - Scope
        - Reward policy
        - Severity methodology
        - Disclosure policy
        - Legal terms
        - FAQ
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the non-sensitive issue.
    validations:
      required: true
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested change
      description: Optional wording or correction.
    validations:
      required: false
