name: Non-sensitive report
about: Report a non-exploitable, non-sensitive issue with the security program documentation.
title: "[Non-sensitive]: "
labels: ["type/non-sensitive", "status/new"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose exploitable vulnerabilities in public issues. Use **Report a vulnerability** instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Scope clarification
        - Reward policy clarification
        - Legal policy clarification
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
