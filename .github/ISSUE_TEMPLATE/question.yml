name: General security question
about: Ask a non-sensitive question about the security program. Do not disclose vulnerabilities here.
title: "[Question]: "
labels: ["type/question", "status/new"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose exploitable vulnerabilities in public issues. Use **Report a vulnerability** instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask your non-sensitive question here.
    validations:
      required: true
