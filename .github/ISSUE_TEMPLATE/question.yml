name: General security question
about: Ask a non-sensitive question about the Security Research Program.
title: "[Question]: "
labels: ["type/question", "status/new"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose exploitable vulnerabilities in public issues. Use **Report a vulnerability** instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask your non-sensitive question here.
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure statement
      options:
        - label: This issue does not contain vulnerability details, exploit steps, secrets, or personal data.
          required: true
